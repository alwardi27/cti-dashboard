<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTI Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0e17;
            --bg-surface: #111827;
            --bg-elevated: #1e293b;
            --accent-primary: #00ff9d;
            --accent-secondary: #0ea5e9;
            --severity-critical: #ef4444;
            --severity-high: #f59e0b;
            --severity-medium: #eab308;
            --severity-low: #22c55e;
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 18px;
            color: var(--bg-deep);
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 600;
            color: var(--accent-primary);
            letter-spacing: -0.5px;
        }

        .header-meta {
            text-align: right;
        }

        .last-updated {
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--bg-elevated);
            border-color: var(--accent-primary);
        }

        .btn.active {
            background: var(--accent-primary);
            color: var(--bg-deep);
            border-color: var(--accent-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-primary);
        }

        .stat-card.critical::before { background: var(--severity-critical); }
        .stat-card.high::before { background: var(--severity-high); }
        .stat-card.recent::before { background: var(--accent-secondary); }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-card.critical .stat-value { color: var(--severity-critical); }
        .stat-card.high .stat-value { color: var(--severity-high); }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            padding: 8px 12px 8px 36px;
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            width: 220px;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg-deep);
            border-bottom: 1px solid var(--border-color);
        }

        .filter-btn {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-primary);
            color: var(--bg-deep);
            border-color: var(--accent-primary);
        }

        .cve-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .cve-list::-webkit-scrollbar {
            width: 6px;
        }

        .cve-list::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }

        .cve-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .cve-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cve-item:hover {
            background: var(--bg-elevated);
        }

        .cve-item.selected {
            background: var(--bg-elevated);
            border-left: 3px solid var(--accent-primary);
        }

        .cve-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .cve-id {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-secondary);
            text-decoration: none;
        }

        .cve-id:hover {
            text-decoration: underline;
        }

        .severity-badge {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .severity-badge.critical {
            background: rgba(239, 68, 68, 0.15);
            color: var(--severity-critical);
        }

        .severity-badge.high {
            background: rgba(245, 158, 11, 0.15);
            color: var(--severity-high);
        }

        .severity-badge.medium {
            background: rgba(234, 179, 8, 0.15);
            color: var(--severity-medium);
        }

        .severity-badge.low {
            background: rgba(34, 197, 94, 0.15);
            color: var(--severity-low);
        }

        .cve-description {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cve-meta {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .cve-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cvss-score {
            font-family: 'Fira Code', monospace;
            font-weight: 600;
        }

        .detail-panel {
            max-height: 600px;
            overflow-y: auto;
        }

        .detail-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .detail-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .detail-content {
            padding: 24px;
        }

        .detail-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-cve-id {
            font-family: 'Fira Code', monospace;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-secondary);
            margin-bottom: 8px;
        }

        .detail-description {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-primary);
            margin-bottom: 12px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .metric-item {
            background: var(--bg-deep);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .metric-value {
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            font-weight: 600;
        }

        .references-list {
            list-style: none;
        }

        .references-list li {
            margin-bottom: 8px;
        }

        .references-list a {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--accent-secondary);
            text-decoration: none;
            word-break: break-all;
        }

        .references-list a:hover {
            text-decoration: underline;
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            padding: 4px 10px;
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-muted);
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--severity-critical);
        }

        .error-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
        }

        .error-state p {
            margin-bottom: 16px;
        }

        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-meta {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <div class="logo">
                <div class="logo-icon">CTI</div>
                <h1>Threat Intelligence Dashboard</h1>
            </div>
            <div class="header-meta">
                <div class="last-updated" id="lastUpdated">Loading...</div>
                <div class="controls">
                    <button class="btn" id="refreshBtn" onclick="fetchData()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                        Refresh
                    </button>
                    <button class="btn" id="autoRefreshBtn" onclick="toggleAutoRefresh()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        Auto: OFF
                    </button>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total CVEs</div>
                <div class="stat-value" id="totalCount">-</div>
            </div>
            <div class="stat-card critical">
                <div class="stat-label">Critical (9.0+)</div>
                <div class="stat-value" id="criticalCount">-</div>
            </div>
            <div class="stat-card high">
                <div class="stat-label">High (7.0-8.9)</div>
                <div class="stat-value" id="highCount">-</div>
            </div>
            <div class="stat-card recent">
                <div class="stat-label">Last 24 Hours</div>
                <div class="stat-value" id="recentCount">-</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">CVE List</span>
                    <div class="search-box">
                        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search CVE or description...">
                    </div>
                </div>
                <div class="filter-row">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
                    <button class="filter-btn" data-filter="critical" onclick="setFilter('critical')">Critical</button>
                    <button class="filter-btn" data-filter="high" onclick="setFilter('high')">High</button>
                    <button class="filter-btn" data-filter="medium" onclick="setFilter('medium')">Medium</button>
                    <button class="filter-btn" data-filter="low" onclick="setFilter('low')">Low</button>
                </div>
                <div class="cve-list" id="cveList">
                    <div class="loader"><div class="spinner"></div></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Vulnerability Details</span>
                </div>
                <div class="detail-panel" id="detailPanel">
                    <div class="detail-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 12h6M12 9v6M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p>Select a CVE to view details</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cveData = [];
        let filteredData = [];
        let selectedCve = null;
        let currentFilter = 'all';
        let searchQuery = '';
        let autoRefreshInterval = null;
        let autoRefreshEnabled = false;

        function getSeverityClass(score) {
            if (score >= 9.0) return 'critical';
            if (score >= 7.0) return 'high';
            if (score >= 4.0) return 'medium';
            return 'low';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function isWithin24Hours(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffHours = (now - date) / (1000 * 60 * 60);
            return diffHours <= 24;
        }

        async function fetchData() {
            const cveList = document.getElementById('cveList');
            cveList.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

            try {
                const response = await fetch('https://services.nvd.nist.gov/rest/json/cves/2.0/?resultsPerPage=50&pubStartDate=' + getDateRange());
                if (!response.ok) throw new Error('API request failed');

                const data = await response.json();
                cveData = processCveData(data.vulnerabilities || []);
                filteredData = [...cveData];

                updateStats();
                renderCveList();
                document.getElementById('lastUpdated').textContent = `Updated: ${formatDate(new Date())}`;
            } catch (error) {
                console.error('Fetch error:', error);
                cveList.innerHTML = `
                    <div class="error-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <p>Failed to fetch CVE data</p>
                        <button class="btn" onclick="fetchData()">Retry</button>
                    </div>
                `;
            }
        }

        function getDateRange() {
            const date = new Date();
            date.setDate(date.getDate() - 30);
            return date.toISOString().split('.')[0] + '+00:00';
        }

        function processCveData(vulnerabilities) {
            return vulnerabilities.map(v => {
                const cve = v.cve;
                const metrics = cve.metrics || {};
                let cvssScore = 0;
                let cvssVector = '';

                if (metrics.cvssMetricV31?.length) {
                    cvssScore = metrics.cvssMetricV31[0].cvssData.baseScore;
                    cvssVector = metrics.cvssMetricV31[0].cvssData.vectorString;
                } else if (metrics.cvssMetricV30?.length) {
                    cvssScore = metrics.cvssMetricV30[0].cvssData.baseScore;
                    cvssVector = metrics.cvssMetricV30[0].cvssData.vectorString;
                } else if (metrics.cvssMetricV2?.length) {
                    cvssScore = metrics.cvssMetricV2[0].cvssData.baseScore;
                }

                const description = cve.descriptions?.find(d => d.lang === 'en')?.value || 'No description available';
                const references = cve.references?.slice(0, 5) || [];
                const published = cve.published || new Date().toISOString();

                return {
                    id: cve.id,
                    description,
                    cvssScore,
                    cvssVector,
                    severity: getSeverityClass(cvssScore),
                    published,
                    references,
                    configurations: cve.configurations || [],
                    weaknesses: cve.weaknesses || []
                };
            }).sort((a, b) => new Date(b.published) - new Date(a.published));
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = cveData.length;
            document.getElementById('criticalCount').textContent = cveData.filter(c => c.severity === 'critical').length;
            document.getElementById('highCount').textContent = cveData.filter(c => c.severity === 'high').length;
            document.getElementById('recentCount').textContent = cveData.filter(c => isWithin24Hours(c.published)).length;
        }

        function applyFilters() {
            filteredData = cveData.filter(cve => {
                const matchesFilter = currentFilter === 'all' || cve.severity === currentFilter;
                const matchesSearch = searchQuery === '' ||
                    cve.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    cve.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });
            renderCveList();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            applyFilters();
        }

        function renderCveList() {
            const cveList = document.getElementById('cveList');

            if (filteredData.length === 0) {
                cveList.innerHTML = '<div class="detail-placeholder"><p>No CVEs found matching your criteria</p></div>';
                return;
            }

            cveList.innerHTML = filteredData.map(cve => `
                <div class="cve-item ${selectedCve?.id === cve.id ? 'selected' : ''}" onclick="selectCve('${cve.id}')">
                    <div class="cve-header">
                        <a href="https://nvd.nist.gov/vuln/detail/${cve.id}" target="_blank" class="cve-id" onclick="event.stopPropagation()">${cve.id}</a>
                        <span class="severity-badge ${cve.severity}">${cve.severity}</span>
                    </div>
                    <div class="cve-description">${escapeHtml(cve.description)}</div>
                    <div class="cve-meta">
                        <span>CVSS: <span class="cvss-score">${cve.cvssScore.toFixed(1)}</span></span>
                        <span>Published: ${formatDate(cve.published)}</span>
                    </div>
                </div>
            `).join('');
        }

        function selectCve(id) {
            selectedCve = cveData.find(c => c.id === id);
            renderCveList();
            renderDetail();
        }

        function renderDetail() {
            const panel = document.getElementById('detailPanel');

            if (!selectedCve) {
                panel.innerHTML = `
                    <div class="detail-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 12h6M12 9v6M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p>Select a CVE to view details</p>
                    </div>
                `;
                return;
            }

            const cve = selectedCve;
            panel.innerHTML = `
                <div class="detail-content">
                    <div class="detail-header">
                        <div class="detail-cve-id">${cve.id}</div>
                        <span class="severity-badge ${cve.severity}" style="font-size: 13px; margin-bottom: 12px;">${cve.severity.toUpperCase()}</span>
                        <p class="detail-description">${escapeHtml(cve.description)}</p>
                    </div>

                    <div class="detail-section">
                        <h3 class="detail-section-title">CVSS Metrics</h3>
                        <div class="metrics-grid">
                            <div class="metric-item">
                                <div class="metric-label">Base Score</div>
                                <div class="metric-value" style="color: var(--severity-${cve.severity})">${cve.cvssScore.toFixed(1)}</div>
                            </div>
                            <div class="metric-item">
                                <div class="metric-label">Severity</div>
                                <div class="metric-value">${cve.severity.toUpperCase()}</div>
                            </div>
                            <div class="metric-item" style="grid-column: span 2;">
                                <div class="metric-label">Vector String</div>
                                <div class="metric-value" style="font-size: 12px; word-break: break-all;">${cve.cvssVector || 'N/A'}</div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3 class="detail-section-title">Timeline</h3>
                        <div class="metrics-grid">
                            <div class="metric-item">
                                <div class="metric-label">Published</div>
                                <div class="metric-value" style="font-size: 13px;">${formatDate(cve.published)}</div>
                            </div>
                        </div>
                    </div>

                    ${cve.references.length > 0 ? `
                    <div class="detail-section">
                        <h3 class="detail-section-title">References</h3>
                        <ul class="references-list">
                            ${cve.references.map(ref => `
                                <li><a href="${escapeHtml(ref.url)}" target="_blank">${escapeHtml(ref.url)}</a></li>
                            `).join('')}
                        </ul>
                    </div>
                    ` : ''}

                    <div class="detail-section">
                        <h3 class="detail-section-title">Actions</h3>
                        <a href="https://nvd.nist.gov/vuln/detail/${cve.id}" target="_blank" class="btn" style="display: inline-flex;">
                            View on NVD
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
                            </svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = !autoRefreshEnabled;
            const btn = document.getElementById('autoRefreshBtn');

            if (autoRefreshEnabled) {
                btn.classList.add('active');
                btn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    Auto: ON
                `;
                autoRefreshInterval = setInterval(fetchData, 5 * 60 * 1000);
            } else {
                btn.classList.remove('active');
                btn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    Auto: OFF
                `;
                clearInterval(autoRefreshInterval);
            }
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = e.target.value;
                applyFilters();
            }, 300);
        });

        fetchData();
    </script>
</body>
</html>
