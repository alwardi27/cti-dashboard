<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTI Dashboard Launcher</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, Arial, sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
        }

        main {
            width: min(560px, calc(100vw - 32px));
            padding: 28px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #111827;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 22px;
            color: #00ff9d;
        }

        p {
            margin: 0 0 16px;
            color: #94a3b8;
            line-height: 1.6;
        }

        code {
            color: #e2e8f0;
            background: #0a0e17;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 2px 6px;
        }

        a {
            color: #0ea5e9;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>CTI Dashboard</h1>
        <p>The active dashboard is served by the local Express app from <code>public/index.html</code>.</p>
        <p>Start it with <code>start-dashboard.cmd</code> or <code>npm start</code>, then open <a href="http://localhost:3000">http://localhost:3000</a>.</p>
    </main>
</body>
</html>
